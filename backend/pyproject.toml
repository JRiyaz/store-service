[project]
name = "store-service"
version = "0.1.0"
description = "Micro-backend for customer checkouts, storefront orders, payments, and PDF receipt invoice generation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlmodel>=0.0.16",
    "pydantic-settings>=2.2.1",
    "aiosqlite>=0.20.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.2",
    "websockets>=12.0",
    "httpx>=0.27.0",
]
